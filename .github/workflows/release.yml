on:
  workflow_run:
    workflows: ["sync-release"]  
    types: [completed]


permissions:
  contents: write

env:
  UPSTREAM: LiteLDev/Levilamina
  UPSTREAM_URL: https://github.com/LiteLDev/Levilamina.git

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target_type:
          - server
          - client
        mode:
          - debug
          - release
    runs-on: windows-latest
    steps:
      - name: Clone upstream repo at release tag
        run: |
          git clone ${{ env.UPSTREAM_URL }} upstream
          cd upstream
          git checkout ${{ github.event.release.tag_name }}

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\.xmake
          key: xmake-${{ hashFiles('upstream/xmake.lua') }}
          restore-keys: |
            xmake-

      - uses: microsoft/setup-msbuild@v3

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m ${{ matrix.mode }} -p windows -v -y --target_type=${{ matrix.target_type }} --publish=y
        working-directory: upstream

      - run: |
          xmake package -o ./sdk
        working-directory: upstream

      - uses: actions/upload-artifact@v7
        with:
          name: levilamina-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64
          path: upstream/sdk/

  update-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Get upstream release notes
        id: upstream_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NOTES=$(gh release view ${{ github.event.release.tag_name }} --repo ${{ env.UPSTREAM }} --json body -q .body)
          echo "notes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body: |
            Built from [${{ env.UPSTREAM }}@${{ github.event.release.tag_name }}](https://github.com/${{ env.UPSTREAM }}/releases/tag/${{ github.event.release.tag_name }})

            ---

            ${{ steps.upstream_notes.outputs.notes }}

  upload-to-release:
    needs:
      - build
      - update-release-notes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_type:
          - server
          - client
        mode:
          - debug
          - release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: levilamina-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64
          path: artifact

      - run: |
          cp CHANGELOG.md COPYING COPYING.LESSER README.md artifact/ 2>/dev/null || true

      - run: |
          cd artifact
          zip -r ../levilamina-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64.zip *
        shell: bash

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            levilamina-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64.zip
