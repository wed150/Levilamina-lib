on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  UPSTREAM: LiteLDev/Levilamina
  UPSTREAM_URL: https://github.com/LiteLDev/Levilamina.git

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target_type:
          - server
          - client
        mode:
          - debug
          - release
    runs-on: windows-latest
    steps:
      - name: Clone repo at release tag
        run: |
          git clone ${{ env.UPSTREAM_URL }} upstream
          cd upstream
          git checkout ${{ github.event.release.tag_name }}

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\.xmake
          key: xmake-${{ hashFiles('upstream/xmake.lua') }}
          restore-keys: |
            xmake-

      - uses: microsoft/setup-msbuild@v3

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m ${{ matrix.mode }} -p windows -v -y --target_type=${{ matrix.target_type }} --publish=y
        working-directory: upstream

      - run: |
          xmake -v -y
        working-directory: upstream

      - run: |
          xmake install -o ./sdk
        working-directory: upstream

      - uses: actions/upload-artifact@v7
        with:
          name: levilamina-sdk-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64
          path: upstream/sdk/



  upload-to-release:
    needs:
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_type:
          - server
          - client
        mode:
          - debug
          - release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: levilamina-sdk-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64
          path: artifact

      - run: |
          cd artifact
          zip -r ../levilamina-sdk-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64.zip *
        shell: bash

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            levilamina-sdk-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64.zip


  report-to-xmake-repo:
    needs: upload-to-release
    runs-on: ubuntu-latest
    steps:
      - name: Compute sha256
        id: sha
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/levilamina-${VERSION}-release-server-windows-x64.zip"
          
          curl -L -o sdk.zip "$DOWNLOAD_URL"
          SHA256=$(sha256sum sdk.zip | cut -d' ' -f1)
          
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Canonical zip SHA256: $SHA256"

      - name: Checkout xmake-repo
        uses: actions/checkout@v7
        with:
          repository: wed150/xmake-repo
          path: xmake-repo
          token: ${{ secrets.MYTOKEN }}
          fetch-depth: 0

      - name: Add entry to prebuilt_versions.txt
        working-directory: xmake-repo
        run: |
          VERSION="${{ steps.sha.outputs.version }}"
          SHA256="${{ steps.sha.outputs.sha256 }}"
          PREBUILT_FILE="packages/l/levilamina/versions/prebuilt_versions.txt"
          
          mkdir -p "$(dirname "$PREBUILT_FILE")"
          
          if grep -q "^$VERSION " "$PREBUILT_FILE" 2>/dev/null; then
            echo "Version $VERSION already exists in prebuilt_versions.txt, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$VERSION $SHA256" >> "$PREBUILT_FILE"
            echo "Added $VERSION $SHA256"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push as real user
        if: steps.sha.outputs.exists != 'true'
        working-directory: xmake-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/l/levilamina/versions/prebuilt_versions.txt
          git commit -m "feat: add prebuilt sha for v${{ steps.sha.outputs.version }}"
          git push https://${{ secrets.PAT_WITH_USER_IDENTITY }}@github.com/wed150/xmake-repo.git