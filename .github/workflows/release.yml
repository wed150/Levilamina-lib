on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  UPSTREAM: LiteLDev/Levilamina
  UPSTREAM_URL: https://github.com/LiteLDev/Levilamina.git

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target_type:
          - server
          - client
        mode:
          - debug
          - release
    runs-on: windows-latest
    steps:
      - name: Clone repo at release tag
        run: |
          git clone ${{ env.UPSTREAM_URL }} upstream
          cd upstream
          git checkout ${{ github.event.release.tag_name }}

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\.xmake
          key: xmake-${{ hashFiles('upstream/xmake.lua') }}
          restore-keys: |
            xmake-

      - uses: microsoft/setup-msbuild@v3

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m ${{ matrix.mode }} -p windows -v -y --target_type=${{ matrix.target_type }} --publish=y
        working-directory: upstream

      - run: |
          xmake -v -y
        working-directory: upstream

      - run: |
          xmake install -o ./sdk
        working-directory: upstream

      - uses: actions/upload-artifact@v7
        with:
          name: levilamina-sdk-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64
          path: upstream/sdk/



  upload-to-release:
    needs:
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_type:
          - server
          - client
        mode:
          - debug
          - release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: levilamina-sdk-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64
          path: artifact

      - run: |
          cd artifact
          zip -r ../levilamina-sdk-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64.zip *
        shell: bash

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            levilamina-sdk-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64.zip


  report-to-xmake-repo:
    needs: upload-to-release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target_type:
          - server
          - client
        mode:
          - debug
          - release
    steps:
      - name: Compute sha256
        id: sha
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          numVERSION="${VERSION#v}"
          TARGET="${{ matrix.target_type }}"
          MODE="${{ matrix.mode }}"
          FILENAME="levilamina-sdk-${VERSION}-${TARGET}-${MODE}-windows-x64.zip"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/${FILENAME}"

          echo "Downloading: $DOWNLOAD_URL"
          curl -L -o sdk.zip "$DOWNLOAD_URL"
          SHA256=$(sha256sum sdk.zip | cut -d' ' -f1)

          # 格式: 数字版本号-平台-模式-目标类型 sha256
          ENTRY="${numVERSION}-windows-${MODE}-${TARGET} ${SHA256}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "entry=$ENTRY" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "Computed: $ENTRY"

      - name: Checkout xmake-repo
        uses: actions/checkout@v7
        with:
          repository: wed150/xmake-repo
          path: xmake-repo
          token: ${{ secrets.MYTOKEN }}
          fetch-depth: 0

      - name: Add entry to prebuilt_versions.txt
        id: check
        working-directory: xmake-repo
        run: |
          ENTRY="${{ steps.sha.outputs.entry }}"
          PREBUILT_FILE="packages/l/levilamina-lib/versions/prebuilt_versions.txt"

          mkdir -p "$(dirname "$PREBUILT_FILE")"

          KEY=$(echo "$ENTRY" | cut -d' ' -f1)
          if grep -q "^${KEY} " "$PREBUILT_FILE" 2>/dev/null; then
            echo "Entry $KEY already exists in prebuilt_versions.txt, skipping"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "$ENTRY" >> "$PREBUILT_FILE"
            echo "Added: $ENTRY"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push as real user
        if: steps.check.outputs.exists != 'true'
        working-directory: xmake-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/l/levilamina-lib/versions/prebuilt_versions.txt
          git commit -m "feat: add prebuilt sha for ${{ steps.sha.outputs.entry }}"
          git push https://${{ secrets.MYTOKEN }}@github.com/wed150/xmake-repo.git
