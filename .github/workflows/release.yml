on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  UPSTREAM: LiteLDev/LeviLamina
  UPSTREAM_URL: https://github.com/LiteLDev/LeviLamina.git

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target_type:
          - server
          - client
        mode:
          - debug
          - release
    runs-on: windows-latest
    steps:
      - name: Clone repo at release tag
        run: |
          git clone ${{ env.UPSTREAM_URL }} upstream
          cd upstream
          git checkout ${{ github.event.release.tag_name }}

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\.xmake
          key: xmake-${{ hashFiles('upstream/xmake.lua') }}
          restore-keys: |
            xmake-

      - uses: microsoft/setup-msbuild@v3

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m ${{ matrix.mode }} -p windows -v -y --target_type=${{ matrix.target_type }} --publish=y
        working-directory: upstream

      - run: |
          xmake -v -y
        working-directory: upstream

      - run: |
          xmake install -o ./sdk
        working-directory: upstream

      - uses: actions/upload-artifact@v7
        with:
          name: levilamina-lib-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64
          path: |
            upstream/sdk/bin/
            upstream/sdk/lib/

  upload-to-release:
    needs:
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_type:
          - server
          - client
        mode:
          - debug
          - release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: levilamina-lib-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64
          path: artifact

      - run: |
          cd artifact
          zip -r ../levilamina-lib-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64.zip *
        shell: bash

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            levilamina-lib-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64.zip

  report-to-xmake-repo:
    needs:
      - upload-to-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xmake-repo (target)
        uses: actions/checkout@v7
        with:
          repository: GroupMountain/xmake-repo
          path: xmake-repo
          token: ${{ secrets.MYTOKEN }}
          fetch-depth: 0

      - name: Checkout upstream xmake-repo
        uses: actions/checkout@v7
        with:
          repository: LiteLDev/xmake-repo
          path: upstream-xmake-repo
          fetch-depth: 1

      - name: Configure git
        working-directory: xmake-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Copy versions & compute sha256
        working-directory: xmake-repo
        env:
          VERSION: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.MYTOKEN }}
        run: |
          set -e
          numVERSION="${VERSION#v}"

          SRC="../upstream-xmake-repo/packages/l/levilamina/versions"
          DST="packages/l/levilamina-lib/versions"
          mkdir -p "$DST"

          echo "=== Copying versions from upstream ==="
          if [ -d "$SRC" ]; then
            for f in "$SRC"/*; do
              [ -f "$f" ] || continue
              bf=$(basename "$f")
              cp "$f" "$DST/$bf"
              echo "Copied: $bf"
            done
          fi

          PREBUILT_FILE="packages/l/levilamina-lib/versions/prebuilt_versions.txt"
          touch "$PREBUILT_FILE"
          TMPFILE=$(mktemp)

          for TARGET in server client; do
            for MODE in release debug; do
              FILENAME="levilamina-lib-${numVERSION}-${TARGET}-${MODE}-windows-x64.zip"
              DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${VERSION}/${FILENAME}"
              KEY="${numVERSION}-windows-${MODE}-${TARGET}"

              echo "=== Processing ${KEY} ==="
              curl -L -o sdk.zip "$DOWNLOAD_URL"
              SHA256=$(sha256sum sdk.zip | cut -d' ' -f1)
              rm -f sdk.zip

              if grep -q "^${KEY} " "$PREBUILT_FILE" 2>/dev/null; then
                echo "Entry $KEY already exists, skipping"
                continue
              fi

              echo "${KEY} ${SHA256}" >> "$TMPFILE"
              echo "Queued: ${KEY} ${SHA256}"
            done
          done

          git add packages/l/levilamina-lib/versions/

          if [ -s "$TMPFILE" ]; then
            cat "$TMPFILE" >> "$PREBUILT_FILE"
            git add "$PREBUILT_FILE"
          fi

          if git diff --cached --quiet; then
            echo "=== Nothing new to commit ==="
          else
            echo "=== Committing ==="
            [ -s "$TMPFILE" ] && cat "$TMPFILE"
            git commit -m "feat(levilamina-lib): add prebuilt sha for ${numVERSION} & sync versions"
            git push https://${TOKEN}@github.com/GroupMountain/xmake-repo.git
            echo "=== Push done ==="
          fi

          rm -f "$TMPFILE"
          echo "=== Final prebuilt_versions.txt ==="
          cat "$PREBUILT_FILE"
