on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  UPSTREAM: LiteLDev/Levilamina
  UPSTREAM_URL: https://github.com/LiteLDev/Levilamina.git

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target_type:
          - server
          - client
        mode:
          - debug
          - release
    runs-on: windows-latest
    steps:
      - name: Clone repo at release tag
        run: |
          git clone ${{ env.UPSTREAM_URL }} upstream
          cd upstream
          git checkout ${{ github.event.release.tag_name }}

      - uses: xmake-io/github-action-setup-xmake@v1

      - uses: actions/cache@v6
        with:
          path: |
            ~\AppData\Local\.xmake
          key: xmake-${{ hashFiles('upstream/xmake.lua') }}
          restore-keys: |
            xmake-

      - uses: microsoft/setup-msbuild@v3

      - run: |
          xmake repo -u

      - run: |
          xmake f -a x64 -m ${{ matrix.mode }} -p windows -v -y --target_type=${{ matrix.target_type }} --publish=y
        working-directory: upstream

      - run: |
          xmake -v -y
        working-directory: upstream

      - run: |
          xmake install -o ./sdk
        working-directory: upstream

      - uses: actions/upload-artifact@v7
        with:
          name: levilamina-sdk-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64
          path: upstream/sdk/



  upload-to-release:
    needs:
      - build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target_type:
          - server
          - client
        mode:
          - debug
          - release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: levilamina-sdk-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64
          path: artifact

      - run: |
          cd artifact
          zip -1 -r ../levilamina-sdk-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64.zip *
        shell: bash

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            levilamina-sdk-${{ github.event.release.tag_name }}-${{ matrix.target_type }}-${{ matrix.mode }}-windows-x64.zip


  report-to-xmake-repo:
    needs: upload-to-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout xmake-repo
        uses: actions/checkout@v7
        with:
          repository: wed150/xmake-repo
          path: xmake-repo
          token: ${{ secrets.MYTOKEN }}
          fetch-depth: 0

      - name: Configure git
        working-directory: xmake-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Compute sha256 and commit for each combination
        working-directory: xmake-repo
        env:
          VERSION: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.MYTOKEN }}
        run: |
          numVERSION="${VERSION#v}"
          PREBUILT_FILE="packages/l/levilamina-lib/versions/prebuilt_versions.txt"
          mkdir -p "$(dirname "$PREBUILT_FILE")"
          touch "$PREBUILT_FILE"

          # 4 个组合，逐个串行处理
          for TARGET in server client; do
            for MODE in release debug; do
              FILENAME="levilamina-sdk-${VERSION}-${TARGET}-${MODE}-windows-x64.zip"
              DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${VERSION}/${FILENAME}"
              KEY="${numVERSION}-windows-${MODE}-${TARGET}"

              echo "=== Processing ${KEY} ==="
              echo "Downloading: $DOWNLOAD_URL"
              curl -L -o sdk.zip "$DOWNLOAD_URL"
              SHA256=$(sha256sum sdk.zip | cut -d' ' -f1)
              rm -f sdk.zip

              ENTRY="${KEY} ${SHA256}"

              # 如果已存在则跳过（re-run 场景）
              if grep -q "^${KEY} " "$PREBUILT_FILE" 2>/dev/null; then
                echo "Entry $KEY already exists, skipping"
                continue
              fi

              # 追加、提交、推送（逐个，避免并发冲突）
              echo "$ENTRY" >> "$PREBUILT_FILE"
              echo "Added: $ENTRY"

              git pull --rebase origin main || true
              git add "$PREBUILT_FILE"
              git commit -m "feat: add prebuilt sha for ${ENTRY}"
              git push https://${TOKEN}@github.com/wed150/xmake-repo.git
            done
          done

          echo "=== All done ==="
          echo "Final prebuilt_versions.txt contents:"
          cat "$PREBUILT_FILE"
